
name: Enterprise Platform CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-platform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python Tests and Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: applications/reference-service

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: applications/reference-service/requirements-dev.txt

      - name: Install hash-locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run tests and generate coverage
        run: |
          python -m pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80 \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-report
          path: applications/reference-service/coverage.xml
          if-no-files-found: error
          retention-days: 7

  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scan:
    name: Docker Build and Trivy Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build reference service image
        run: |
          docker build --pull \
            --file applications/reference-service/Dockerfile \
            --tag enterprise-reference-service:${{ github.sha }} \
            applications/reference-service

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: enterprise-reference-service:${{ github.sha }}
          format: json
          output: trivy-results.json
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload Trivy scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-container-scan-report
          path: trivy-results.json
          if-no-files-found: warn
          retention-days: 7
