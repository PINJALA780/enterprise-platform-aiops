
name: Enterprise Platform CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-platform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python Tests and Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: applications/reference-service

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: applications/reference-service/requirements-dev.txt

      - name: Install hash-locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run tests and generate coverage
        run: |
          python -m pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80 \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-report
          path: applications/reference-service/coverage.xml
          if-no-files-found: error
          retention-days: 7

  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scan:
    name: Docker Build, Trivy Scan, SBOM and ECR Push
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - test
      - secret-scan

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build reference service image
        run: |
          docker build --pull \
            --file applications/reference-service/Dockerfile \
            --tag enterprise-reference-service:${{ github.sha }} \
            applications/reference-service

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: enterprise-reference-service:${{ github.sha }}
          format: json
          output: trivy-results.json
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Generate Docker image SBOM
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: enterprise-reference-service:${{ github.sha }}
          format: spdx-json
          output: image-sbom.spdx.json
          exit-code: '0'

      - name: Upload Trivy scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-container-scan-report
          path: trivy-results.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-service-sbom
          path: image-sbom.spdx.json
          if-no-files-found: warn
          retention-days: 30

      - name: Diagnose GitHub OIDC claims
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python - <<'PY'
          import os
          import json
          import base64
          import urllib.request
          import urllib.parse

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]

          separator = "&" if "?" in url else "?"
          url += separator + urllib.parse.urlencode({
              "audience": "sts.amazonaws.com"
          })

          request = urllib.request.Request(
              url,
              headers={"Authorization": f"Bearer {token}"}
          )

          with urllib.request.urlopen(request) as response:
              jwt = json.load(response)["value"]

          payload = jwt.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          for key in ["iss", "aud", "sub", "repository", "ref"]:
              print(f"{key}: {claims.get(key)}")
          PY

      - name: Configure AWS credentials using GitHub OIDC
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag image for ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag \
            enterprise-reference-service:${{ github.sha }} \
            848635215310.dkr.ecr.ap-south-1.amazonaws.com/enterprise-reference-service:${{ github.sha }}

      - name: Push image to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push \
            848635215310.dkr.ecr.ap-south-1.amazonaws.com/enterprise-reference-service:${{ github.sha }}
